spring:
  application:
    name: AgroAPI-Llontop-Vivas
  datasource:
    url: ${DB_URL:jdbc:h2:file:./agroapi-data;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
app:
  jwt:
    # Solo desarrollo; en producción configura JWT_SECRET_BASE64 (32 bytes o más).
    secret-base64: ${JWT_SECRET_BASE64:TGxvbnRvcFZpdmFzQWdyb1NpZXJyYVNlY3VyZTIwMjZXaXRoMzJCeXRlcw==}
    expiration-minutes: 60
